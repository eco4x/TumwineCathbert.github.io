<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#142a3e"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#edf4fb}.muted{fill:#a4b4c7}.accent{fill:#55e0c0}.warn{fill:#ffc76b}.label{font-size:19px;letter-spacing:3px}.title{font-size:52px;font-weight:bold}.body{font-size:25px}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="95" class="label accent">ECOTECHLABS · IAM HOMELAB / 04</text><text x="90" y="170" class="title">Application access assignment</text><rect x="90" y="250" width="650" height="370" rx="24" fill="#10283a" stroke="#55e0c0"/><text x="135" y="315" class="label accent">ASSIGNMENT COMPLETED</text><text x="135" y="390" font-size="39" font-weight="bold">David Brown</text><text x="135" y="445" class="body muted">ECL-Finance member</text><text x="135" y="510" class="body">EcoTechLabs Finance Portal</text><rect x="135" y="545" width="250" height="45" rx="9" fill="#173a40"/><text x="160" y="575" font-size="20" class="accent">Default Access</text><rect x="790" y="250" width="720" height="370" rx="24" fill="#2b2418" stroke="#ffc76b"/><text x="835" y="315" class="label warn">TENANT PLAN LIMITATION</text><text x="835" y="380" font-size="34" font-weight="bold">Group assignment unavailable</text><text x="835" y="440" class="body muted">The tenant displayed a licensing restriction.</text><text x="835" y="490" class="body muted">The lab therefore used an individual user</text><text x="835" y="530" class="body muted">assignment instead of group assignment.</text><text x="90" y="720" class="body">What this proves</text><text x="90" y="770" font-size="23" class="muted">A user was assigned to the enterprise application. Group membership did not automatically grant access.</text><text x="90" y="835" font-size="20" class="warn">Default Access does not demonstrate a custom read-only role or fine-grained authorization.</text></svg>